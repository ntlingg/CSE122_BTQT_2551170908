<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Document</title>
        <style>
            .container{
                background-color:#FFFDE7 ;
                border: 0.2px solid #9E9E9E;
                width: 500px;
                margin: 20px auto;
                text-align: center;
            }
            h1{
                color:  #D40000;
                background-color:#FFD9E6 ;
                text-align: center;
                padding: 10px;
                font-family: arial, sans-serif;
            }
            p1{
                color:#0033CC ;
                font-style: italic;
                line-height: 1.6;
            }
            p2{
                color:#D40000 ;
                font-style: italic;
                line-height: 1.6;
            }
            hr{
                border-top: 1px;
                height: 0,2px;
                width: 55%;
                margin: 15px auto;
            }
        </style>
    </head>
    <body>
        <div class="container">
        <h1>BỐN MÙA</h1>
        <p1>Xuân về hoa nở khắp trời <br>
        Hạ sang nắng cháy rạng ngời phố quen <br>
        Thu về lá rụng bên thềm </p1>
        <hr>
        <p2>Đông sang gió lạnh bên em đợi chờ <br>
        Bốn mùa là bốn giấc mơ <br>
        Thời gian đi mãi ta chờ đợi ai</p2>
        <hr>
        <p1>Một năm rồi lại một năm<br> 
        Vẫn còn câu hát thì thầm quê hương <br>
        Chờ xuân nắng mới soi đường</p1>
        </div>
    </body>
</html>
