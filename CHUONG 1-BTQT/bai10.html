<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="uidth=device-width, initial-scale=1.0">
        <title>Trang liên hệ</title>
        <link rel="stylesheet" href="bai10.css">
    </head>
    <body>
        <div class="nen-trang">
            <form class="the-form" action ="#" method="post">
                <div class="dau-form">
                    <h1>Liên hệ với chúng tôi</h1>
                    <p>Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.</p>
                </div>
                <div class="than-form">
                    <div class="luoi-2-cot">
                        <div class="o-nhom">
                            <label for="ho-ten">Họ và tên</label>
                            <input type="text" id="ho-ten" value="Nguyễn Văn An">
                        </div>
                        <div class="o-nhom">
                            <label for="email">Email</label>
                            <input type="text" id="email" value="an.nv@tlu.edu.vn">
                        </div>
                        <div class="o-nhom">
                            <label for="sdt">Số điện thoại</label>
                            <input type="text" id="sdt" value="0987 654 321">
                        </div>
                        <div class="o-nhom">
                            <label for="chu-de">Chủ đề</label>
                            <select id="chu-de">
                                <option>Hỏi về khóa học</option>
                                <option>Báo lỗi bài tập</option>
                                <option>Góp ý</option>
                                <option>Khác</option>
                            </select>
                        </div>
                        </div>
                        <div class="o-nhom">
                            <label for="noi-dung">Nội dung</label>
                            <textarea id="noi-dung" rows="4">Em muốn hỏi về lịch nộp bài tập môn Lập trình Web ạ</textarea>
                        </div>
                        <div class="dong-y">
                            <input type="checkbox" id="dong-y" checked>
                            <label for="dong-y">Tôi đồng ý nhận email phản hồi.</label>
                        </div>
                        <div class="hang-nut">
                            <button type="submit" class="nut-gui">Gửi liên hệ</button>
                            <button type="submit" class="nut-nhap-lai">Nhập lại</button>
                        </div>
                </div>
            </form>
        </div>
    </body>
</html>
