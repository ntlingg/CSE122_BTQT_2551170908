<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách việc cần làm</title>
    <link rel="stylesheet" href="bai16.css">
</head>
<body>
    <main>
        <div class="header">
            <h1>Danh sách việc cần làm</h1>
            <p>Thêm việc mới, đánh dấu hoàn thành hoặc xóa - tất cả bằng JavaScript.</p>
        </div>
        <div class="content">
            <div class="input-task">
                <input type="text" id="new-task" placeholder="Hoàn thành bài lập trình Web">
                <button id="add-task">Thêm</button>
            </div>
            <ul class="task-list">
                <li class="task-item completed">
                    <div class="task-left">
                        <div class="checkbox"></div>
                        <span class="task-text">Đọc chương HTML5 cơ bản</span>
                    </div>
                    <button class="btn-delete">Xoá</button>
                </li>
                <li class="task-item">
                    <div class="task-left">
                        <div class="checkbox"></div>
                        <span class="task-text">Làm bài tập CSS Grid</span>
                    </div>
                    <button class="btn-delete">Xoá</button>
                </li>
                <li class="task-item">
                    <div class="task-left">
                        <div class="checkbox"></div>
                        <span class="task-text">Quay video OBS nộp bài</span>
                    </div>
                    <button class="btn-delete">Xoá</button>
                </li>
            </ul>
            <div id="footerCount" class="app-footer">
                Còn 2 việc chưa hoàn thành
            </div>
        </div>
    </main>
    <script src="bai16.js"></script>
</body>
</html>
